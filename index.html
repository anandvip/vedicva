<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>VedicVA — Jyotish Timing Report (Dec 2026 – Dec 2030)</title>
  <style>
    /* =========================================================================
       SWISS LEDGER DESIGN SYSTEM — ZERO FLUFF, HIGH SIGNAL
       Pure CSS, zero external fonts or CDN libraries (100% offline capable).
       ========================================================================= */
    :root {
      /* Surfaces & Rules */
      --bg-canvas: #FFFFFF;
      --bg-surface: #F7F7F5;
      --bg-surface-alt: #EFEFEB;
      --border-hairline: #E2E2DE;
      --border-strong: #111111;

      /* Typography Ink */
      --ink-primary: #111111;
      --ink-secondary: #52524E;
      --ink-muted: #767670;

      /* Status Semantic Palette */
      --st-fav: #146C43;
      --st-fav-bg: #F2F9F5;
      --st-mod: #1B5E8A;
      --st-mod-bg: #F2F7FA;
      --st-mix: #9A5B00;
      --st-mix-bg: #FCF8F0;
      --st-calm: #5A626A;
      --st-calm-bg: #F5F6F7;
      --st-caut: #B42318;
      --st-caut-bg: #FDF3F2;

      /* Font Stacks */
      --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

      /* Layout Geometry */
      --radius: 3px;
      --header-h: 56px;
      --nav-h: 60px;
      --max-w: 720px;
      color-scheme: light;
    }

    /* Dark theme: same roles, night values (follows the device, or data-theme) */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
      --bg-canvas: #161615; --bg-surface: #0E0E0D; --bg-surface-alt: #1F1F1D;
      --border-hairline: #2E2E2B; --border-strong: #EDEDE8;
      --ink-primary: #EDEDE8; --ink-secondary: #B5B5AE; --ink-muted: #8F8F88;
      --st-fav: #4CC38A; --st-fav-bg: #11241A; --st-mod: #5AA9E0; --st-mod-bg: #0F1D28;
      --st-mix: #E0A23C; --st-mix-bg: #261C0B; --st-calm: #9AA3AB; --st-calm-bg: #1B1D1F;
      --st-caut: #F07064; --st-caut-bg: #2A1311;
      color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg-canvas: #161615; --bg-surface: #0E0E0D; --bg-surface-alt: #1F1F1D;
      --border-hairline: #2E2E2B; --border-strong: #EDEDE8;
      --ink-primary: #EDEDE8; --ink-secondary: #B5B5AE; --ink-muted: #8F8F88;
      --st-fav: #4CC38A; --st-fav-bg: #11241A; --st-mod: #5AA9E0; --st-mod-bg: #0F1D28;
      --st-mix: #E0A23C; --st-mix-bg: #261C0B; --st-calm: #9AA3AB; --st-calm-bg: #1B1D1F;
      --st-caut: #F07064; --st-caut-bg: #2A1311;
      color-scheme: dark;
    }
    /* Print always uses the light ledger */
    @media print {
      html:root:not([data-print]) {
      --bg-canvas: #FFFFFF; --bg-surface: #F7F7F5; --bg-surface-alt: #EFEFEB;
      --border-hairline: #E2E2DE; --border-strong: #111111;
      --ink-primary: #111111; --ink-secondary: #52524E; --ink-muted: #767670;
      --st-fav: #146C43; --st-fav-bg: #F2F9F5; --st-mod: #1B5E8A; --st-mod-bg: #F2F7FA;
      --st-mix: #9A5B00; --st-mix-bg: #FCF8F0; --st-calm: #5A626A; --st-calm-bg: #F5F6F7;
      --st-caut: #B42318; --st-caut-bg: #FDF3F2;
      color-scheme: light;
      }
    }

    /* VA mark in the header */
    .brand-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-logo { flex-shrink: 0; display: flex; }
    .brand-logo svg { width: 40px; height: auto; display: block; }
    /* the mark's black and white parts follow the theme; red and blue stay */
    .brand-logo g[fill="#000000"] { fill: var(--ink-primary); }
    .brand-logo g[fill="#FFFFFF"] { fill: var(--bg-canvas); }

    /* All-windows ledger */
    .seg-bar.two { grid-template-columns: repeat(2, 1fr); }
    .year-head { margin: 14px 0 6px; padding-bottom: 4px; border-bottom: 1px solid var(--border-strong); }
    .year-head:first-child { margin-top: 0; }
    .lrow { background-color: var(--bg-canvas); border: 1px solid var(--border-hairline); border-radius: var(--radius); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
    .lrow-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px; }
    .lrow-title { font-size: 13.5px; font-weight: 700; color: var(--ink-primary); line-height: 1.3; }
    .lrow-rule { font-size: 12px; color: var(--ink-secondary); }
    .lrow-note { font-size: 12px; color: var(--ink-primary); }
    .lrow-tags { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
    .rows-stack { display: flex; flex-direction: column; gap: 8px; }

    /* Reset & Base */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background-color: var(--bg-surface);
      color: var(--ink-primary);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.48;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-surface);
      overflow-x: hidden;
    }

    button {
      font-family: inherit;
      color: inherit;
      background: none;
      border: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* Tabular Monospace Utility */
    .mono {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    /* Uppercase Tracked Micro-Label */
    .micro {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    /* =========================================================================
       APP SHELL: FIXED TOP HEADER, CENTERED LEDGER COLUMN, FIXED BOTTOM NAV
       ========================================================================= */
    .app-shell {
      width: 100%;
      max-width: var(--max-w);
      min-height: 100vh;
      margin: 0 auto;
      background-color: var(--bg-canvas);
      border-left: 1px solid var(--border-hairline);
      border-right: 1px solid var(--border-hairline);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    @media (max-width: 720px) {
      .app-shell {
        border-left: none;
        border-right: none;
      }
    }

    /* Fixed Compact Top Header */
    .top-header {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: var(--max-w);
      height: var(--header-h);
      background-color: var(--bg-canvas);
      border-bottom: 1.5px solid var(--border-strong);
      border-left: 1px solid var(--border-hairline);
      border-right: 1px solid var(--border-hairline);
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      z-index: 40;
    }

    @media (max-width: 720px) {
      .top-header {
        border-left: none;
        border-right: none;
      }
    }

    .brand-block {
      min-width: 0;
    }

    .brand-top {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .brand-name {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--ink-primary);
    }

    .brand-span {
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-secondary);
    }

    .brand-sub {
      font-size: 11px;
      color: var(--ink-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    .print-btn {
      min-height: 36px;
      min-width: 60px;
      padding: 0 10px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      background-color: var(--bg-canvas);
      color: var(--ink-primary);
      flex-shrink: 0;
    }

    .print-btn:active {
      background-color: var(--ink-primary);
      color: var(--bg-canvas);
    }

    /* Main Content Container */
    .main-view {
      flex: 1;
      padding: calc(var(--header-h) + 14px) 14px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom));
    }

    /* Fixed Bottom 5-Tab Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: var(--max-w);
      min-height: var(--nav-h);
      padding-bottom: env(safe-area-inset-bottom);
      background-color: var(--bg-canvas);
      border-top: 1.5px solid var(--border-strong);
      border-left: 1px solid var(--border-hairline);
      border-right: 1px solid var(--border-hairline);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      z-index: 40;
    }

    @media (max-width: 720px) {
      .bottom-nav {
        border-left: none;
        border-right: none;
      }
    }

    .nav-btn {
      min-height: 54px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--ink-muted);
      position: relative;
      padding: 6px 2px;
    }

    .nav-btn svg {
      width: 19px;
      height: 19px;
      stroke-width: 1.75;
    }

    .nav-btn span {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .nav-btn.active {
      color: var(--ink-primary);
      background-color: var(--bg-surface);
    }

    .nav-btn.active::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2.5px;
      background-color: var(--ink-primary);
    }

    /* =========================================================================
       COMMON LEDGER COMPONENTS
       ========================================================================= */
    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 8px;
      border-bottom: 1.5px solid var(--border-strong);
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--ink-primary);
    }

    .ledger-box {
      background-color: var(--bg-canvas);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius);
    }

    .ledger-surface {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius);
    }

    /* Status Badges & Left Borders */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 6px;
      border-radius: var(--radius);
      border: 1px solid currentColor;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      line-height: 1.3;
      white-space: nowrap;
    }

    .st-FAVOURABLE { color: var(--st-fav); background-color: var(--st-fav-bg); border-color: var(--st-fav); }
    .st-MODERATE   { color: var(--st-mod); background-color: var(--st-mod-bg); border-color: var(--st-mod); }
    .st-MIXED      { color: var(--st-mix); background-color: var(--st-mix-bg); border-color: var(--st-mix); }
    .st-CALM       { color: var(--st-calm); background-color: var(--st-calm-bg); border-color: var(--st-calm); }
    .st-CAUTION    { color: var(--st-caut); background-color: var(--st-caut-bg); border-color: var(--st-caut); }

    .bl-FAVOURABLE { border-left: 4px solid var(--st-fav); }
    .bl-MODERATE   { border-left: 4px solid var(--st-mod); }
    .bl-MIXED      { border-left: 4px solid var(--st-mix); }
    .bl-CALM       { border-left: 4px solid var(--st-calm); }
    .bl-CAUTION    { border-left: 4px solid var(--st-caut); }

    .conf-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--ink-muted);
      border: 1px solid var(--border-hairline);
      background-color: var(--bg-surface);
      padding: 2px 5px;
      border-radius: var(--radius);
      text-transform: uppercase;
    }

    /* Segmented Control */
    .seg-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 14px;
    }

    .seg-btn {
      min-height: 44px;
      padding: 6px 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background-color: var(--bg-canvas);
      color: var(--ink-secondary);
      border-right: 1px solid var(--border-hairline);
    }

    .seg-btn:last-child {
      border-right: none;
    }

    .seg-btn.active {
      background-color: var(--ink-primary);
      color: var(--bg-canvas);
    }

    /* Key-Value Ledger Rows */
    .kv-list {
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius);
      background-color: var(--bg-canvas);
    }

    .kv-row {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-hairline);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .kv-row:last-child {
      border-bottom: none;
    }

    .kv-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }

    .kv-key {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-primary);
    }

    .kv-val {
      font-size: 12.5px;
      color: var(--ink-secondary);
    }

    /* =========================================================================
       TAB 1: WINDOWS
       ========================================================================= */
    .climate-strip {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-left: 4px solid var(--st-calm);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 14px;
    }

    .climate-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .climate-dates {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-primary);
      margin-bottom: 4px;
    }

    .climate-desc {
      font-size: 12.5px;
      color: var(--ink-secondary);
    }

    /* Horizontal Scrollable Filter Pills (Snap, No Scrollbar Clutter) */
    .filter-strip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scroll-snap-type: x proximity;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 4px;
      margin-bottom: 12px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .filter-strip::-webkit-scrollbar {
      display: none;
    }

    .pill {
      scroll-snap-align: start;
      flex-shrink: 0;
      min-height: 38px;
      padding: 0 11px;
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius);
      background-color: var(--bg-canvas);
      color: var(--ink-secondary);
      font-size: 11.5px;
      font-weight: 600;
      white-space: nowrap;
    }

    .pill.active {
      background-color: var(--ink-primary);
      border-color: var(--ink-primary);
      color: var(--bg-canvas);
    }

    .filter-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    /* Window Ledger Cards */
    .cards-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .win-card {
      background-color: var(--bg-canvas);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .win-body {
      padding: 12px 12px 10px;
    }

    .win-meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 7px;
    }

    .win-badges {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .win-date {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-primary);
    }

    .win-title {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--ink-primary);
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .win-verdict {
      font-size: 13px;
      color: var(--ink-secondary);
      margin-bottom: 9px;
    }

    .area-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .area-tag {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--ink-secondary);
      background-color: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius);
      padding: 2px 6px;
    }

    /* 4-Layer Audit Accordion */
    .acc-trigger {
      width: 100%;
      min-height: 44px;
      padding: 0 12px;
      border-top: 1px solid var(--border-hairline);
      background-color: var(--bg-surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--ink-primary);
    }

    .acc-panel {
      display: none;
      border-top: 1px solid var(--border-hairline);
      background-color: var(--bg-canvas);
      padding: 10px 12px 12px;
    }

    .acc-panel.open {
      display: block;
    }

    .audit-grid {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .audit-row {
      display: grid;
      grid-template-columns: 112px 1fr;
      gap: 8px;
      font-size: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-hairline);
    }

    .audit-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .audit-label {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ink-muted);
      padding-top: 1px;
    }

    .audit-val {
      color: var(--ink-primary);
      font-size: 12.5px;
    }

    .refinement-box {
      margin-top: 9px;
      padding: 8px 10px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-left: 3px solid var(--ink-primary);
      border-radius: var(--radius);
      font-size: 12px;
      color: var(--ink-primary);
    }

    .refinement-box strong {
      display: block;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    /* =========================================================================
       TAB 2: CALENDAR (5-YEAR INTERACTIVE LEDGER MATRIX)
       ========================================================================= */
    .legend-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      padding: 9px 10px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius);
      margin-bottom: 14px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--ink-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .swatch {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      display: inline-block;
    }

    .matrix-wrap {
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius);
      background-color: var(--bg-canvas);
      padding: 10px 8px;
      margin-bottom: 14px;
    }

    .matrix-head,
    .matrix-row {
      display: grid;
      grid-template-columns: 40px repeat(12, minmax(0, 1fr));
      gap: 3px;
      align-items: center;
    }

    .matrix-head {
      margin-bottom: 6px;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--border-hairline);
    }

    .matrix-head span {
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      color: var(--ink-muted);
    }

    .matrix-row {
      margin-bottom: 4px;
    }

    .matrix-row:last-child {
      margin-bottom: 0;
    }

    .matrix-year {
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-primary);
    }

    .m-cell {
      height: 30px;
      border-radius: 2px;
      border: 1px solid transparent;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .m-cell.empty {
      background-color: var(--bg-surface);
      color: var(--border-hairline);
      cursor: default;
    }

    .m-cell.active-cell {
      outline: 2px solid var(--ink-primary);
      outline-offset: -1px;
      z-index: 2;
    }

    .inspect-panel {
      border: 1.5px solid var(--border-strong);
      border-radius: var(--radius);
      background-color: var(--bg-canvas);
      padding: 12px;
    }

    .inspect-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-hairline);
      margin-bottom: 10px;
    }

    .inspect-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--ink-primary);
    }

    /* =========================================================================
       TAB 3: TRANSITS & DASHA
       ========================================================================= */
    .transit-card {
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius);
      background-color: var(--bg-canvas);
      margin-bottom: 12px;
      overflow: hidden;
    }

    .transit-head {
      padding: 10px 12px;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-hairline);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }

    .transit-name {
      font-size: 13.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .transit-list {
      list-style: none;
    }

    .transit-list li {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border-hairline);
      font-size: 12.5px;
    }

    .transit-list li:last-child {
      border-bottom: none;
    }

    .t-date {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--ink-primary);
      display: block;
      margin-bottom: 2px;
    }

    .t-detail {
      color: var(--ink-secondary);
    }

    /* =========================================================================
       TAB 4: CHART & ASHTAKAVARGA (3x4 MOBILE GRID)
       ========================================================================= */
    .privacy-banner {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-left: 3px solid var(--ink-primary);
      border-radius: var(--radius);
      padding: 10px 12px;
      font-size: 12px;
      color: var(--ink-secondary);
      margin-bottom: 14px;
    }

    .graha-table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius);
      margin-bottom: 18px;
      font-size: 12.5px;
    }

    .graha-table th,
    .graha-table td {
      text-align: left;
      padding: 8px 8px;
      border-bottom: 1px solid var(--border-hairline);
      vertical-align: top;
    }

    .graha-table th {
      background-color: var(--bg-surface);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    .graha-table tr:last-child td {
      border-bottom: none;
    }

    .av-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
      margin-bottom: 10px;
    }

    .av-tile {
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius);
      background-color: var(--bg-canvas);
      padding: 8px 7px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .av-tile.av-strong {
      border-color: var(--st-fav);
      background-color: var(--st-fav-bg);
    }

    .av-tile.av-weak {
      border-color: var(--st-caut);
      background-color: var(--st-caut-bg);
    }

    .av-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 4px;
    }

    .av-sign {
      font-size: 12px;
      font-weight: 800;
      color: var(--ink-primary);
    }

    .av-house {
      font-size: 10px;
      color: var(--ink-muted);
    }

    .av-score-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .av-big {
      font-size: 16px;
      font-weight: 800;
      color: var(--ink-primary);
      line-height: 1;
    }

    .av-sub-scores {
      font-size: 10px;
      color: var(--ink-secondary);
    }

    .av-bar-track {
      width: 100%;
      height: 4px;
      background-color: var(--border-hairline);
      border-radius: 1px;
      overflow: hidden;
    }

    .av-bar-fill {
      height: 100%;
      background-color: var(--ink-primary);
    }

    .av-tile.av-strong .av-bar-fill { background-color: var(--st-fav); }
    .av-tile.av-weak .av-bar-fill   { background-color: var(--st-caut); }

    /* =========================================================================
       TAB 5: METHOD & AUDIT
       ========================================================================= */
    .check-list {
      list-style: none;
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius);
      background-color: var(--bg-canvas);
      margin-bottom: 14px;
    }

    .check-list li {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-hairline);
      display: grid;
      grid-template-columns: 22px 1fr;
      gap: 6px;
      font-size: 12.5px;
    }

    .check-list li:last-child {
      border-bottom: none;
    }

    .check-num {
      font-weight: 800;
      color: var(--ink-primary);
    }

    .disclaimer-box {
      padding: 12px;
      border-top: 1.5px solid var(--border-strong);
      border-bottom: 1.5px solid var(--border-strong);
      background-color: var(--bg-surface);
      font-size: 12.5px;
      font-style: italic;
      color: var(--ink-primary);
      text-align: center;
    }

    /* =========================================================================
       PRINT STYLESHEET — CLEAN BLACK & WHITE SWISS LEDGER PRINTOUT
       ========================================================================= */
    @media print {
      @page {
        margin: 14mm;
      }
      html, body {
        background: #FFFFFF !important;
        color: #000000 !important;
        font-size: 11pt;
      }
      .app-shell {
        max-width: 100% !important;
        border: none !important;
      }
      .top-header {
        position: static !important;
        transform: none !important;
        left: auto !important;
        max-width: 100% !important;
        border-left: none !important;
        border-right: none !important;
        padding: 0 0 8px 0 !important;
        height: auto !important;
        margin-bottom: 12px;
      }
      .bottom-nav,
      .print-btn,
      .filter-strip,
      .seg-bar {
        display: none !important;
      }
      .main-view {
        padding: 0 !important;
      }
      .win-card,
      .transit-card,
      .inspect-panel,
      .av-tile {
        break-inside: avoid;
        page-break-inside: avoid;
      }
      .acc-panel {
        display: block !important;
      }
      .acc-trigger {
        display: none !important;
      }
      .badge, .st-FAVOURABLE, .st-MODERATE, .st-MIXED, .st-CALM, .st-CAUTION,
      .av-tile.av-strong, .av-tile.av-weak {
        color: #000000 !important;
        background-color: #FFFFFF !important;
        border-color: #000000 !important;
      }
      .bl-FAVOURABLE, .bl-MODERATE, .bl-MIXED, .bl-CALM, .bl-CAUTION {
        border-left: 3px solid #000000 !important;
      }
    }
  </style>
</head>

                <span class="t-date mono">31 Dec 2028 · Total Lunar Eclipse in Mithuna</span>
                <span class="t-detail">Occurs directly on the natal Moon sign (Mithuna). Observe strict <span class="mono">±3-day</span> Muhurta avoidance for major signings, launches, or travel departures.</span>
              </li>
            </ul>
          </div>

          <div class="transit-card bl-MIXED">
            <div class="transit-head">
              <span class="transit-name">Inner-Planet Retrogrades</span>
              <span class="badge st-MIXED">MIXED</span>
            </div>
            <ul class="transit-list">
              <li>
                <span class="t-date mono">Mars Retrograde</span>
                <span class="t-detail"><span class="mono">10 Jan – 1 Apr 2027</span> and <span class="mono">14 Feb – 6 May 2029</span>. Avoid vehicle, land, and property purchases during Mars Rx.</span>
              </li>
              <li>
                <span class="t-date mono">Mercury Retrograde (2027 Focus)</span>
                <span class="t-detail"><span class="mono">9 Feb – 3 Mar 2027</span> · <span class="mono">10 Jun – 5 Jul 2027</span> · <span class="mono">7 Oct – 28 Oct 2027</span>. Double-check contracts, filings, and travel bookings.</span>
              </li>
            </ul>
          </div>
        `;
      }

      return `
        <div class="section-head">
          <h1 class="section-title">Transits &amp; Dasha</h1>
          <span class="micro mono">LAHIRI · IST</span>
        </div>

        <div class="seg-bar" role="tablist" aria-label="Transit Views">
          <button type="button" class="seg-btn ${state.transitSub === 'dasha' ? 'active' : ''}" onclick="setTransitSub('dasha')">Dasha</button>
          <button type="button" class="seg-btn ${state.transitSub === 'planets' ? 'active' : ''}" onclick="setTransitSub('planets')">Slow Planets</button>
          <button type="button" class="seg-btn ${state.transitSub === 'special' ? 'active' : ''}" onclick="setTransitSub('special')">Special Days</button>
        </div>

        ${bodyHtml}
      `;
    }

    /* --- TAB 4: CHART & ASHTAKAVARGA --- */
    function renderChart() {
      const modeCfg = {
        sav: { label: 'SAV', max: 36, strong: 30, weak: 25 },
        jup: { label: 'JUP', max: 8,  strong: 5,  weak: 3  },
        sat: { label: 'SAT', max: 8,  strong: 5,  weak: 2  }
      }[state.avMode];

      const grahaRows = CHART_GRAHAS.map(g => `
        <tr>
          <td style="font-weight:700;color:var(--ink-primary);white-space:nowrap;">${g.body}</td>
          <td style="white-space:nowrap;">${g.sign} <span class="mono" style="color:var(--ink-muted);font-size:11px;">(${g.house})</span></td>
          <td style="color:var(--ink-secondary);">${g.role}</td>
        </tr>
      `).join('');

      const avTiles = AV_DATA.map(s => {
        const val = s[state.avMode];
        const pct = Math.min(100, Math.round((val / modeCfg.max) * 100));
        let tone = '';
        if (val >= modeCfg.strong) tone = 'av-strong';
        else if (val <= modeCfg.weak) tone = 'av-weak';

        return `
          <div class="av-tile ${tone}" title="${s.full} (${s.h}): SAV ${s.sav}, Jup ${s.jup}, Sat ${s.sat}">
            <div class="av-top">
              <span class="av-sign">${s.code}</span>
              <span class="av-house mono">${s.h}</span>
            </div>
            <div class="av-score-row">
              <span class="av-big mono">${val}</span>
              <span class="av-sub-scores mono">J${s.jup}·S${s.sat}</span>
            </div>
            <div class="av-bar-track">
              <div class="av-bar-fill" style="width:${pct}%;"></div>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="section-head">
          <h1 class="section-title">Chart Basis</h1>
          <span class="micro mono">WHOLE SIGN</span>
        </div>

        <div class="privacy-banner">
          Sidereal (Lahiri) whole-sign chart. Birth details are kept private; only derived placements are shown.
        </div>

        <table class="graha-table" aria-label="Derived Natal Placements">
          <thead>
            <tr>
              <th>Body</th>
              <th>Sign (House)</th>
              <th>Role / Structural Note</th>
            </tr>
          </thead>
          <tbody>
            ${grahaRows}
          </tbody>
        </table>

        <div class="section-head">
          <h2 class="section-title">Ashtakavarga Grid</h2>
          <span class="micro mono">AVG SAV 28</span>
        </div>

        <div class="seg-bar" role="tablist" aria-label="Ashtakavarga Metric">
          <button type="button" class="seg-btn mono ${state.avMode === 'sav' ? 'active' : ''}" onclick="setAvMode('sav')">SAV (337)</button>
          <button type="button" class="seg-btn mono ${state.avMode === 'jup' ? 'active' : ''}" onclick="setAvMode('jup')">JUP (56)</button>
          <button type="button" class="seg-btn mono ${state.avMode === 'sat' ? 'active' : ''}" onclick="setAvMode('sat')">SAT (39)</button>
        </div>

        <div class="av-grid" aria-label="12-Sign Ashtakavarga Scores">
          ${avTiles}
        </div>

        <div class="legend-bar" style="margin-bottom:0;">
          <span class="legend-item"><span class="swatch" style="background:var(--st-fav);"></span>Strong (${state.avMode === 'sav' ? '30+ SAV' : '5+ BAV'})</span>
          <span class="legend-item"><span class="swatch" style="background:var(--st-caut);"></span>Weak (${state.avMode === 'sav' ? '≤25 SAV' : state.avMode === 'jup' ? '≤3 BAV' : '≤2 BAV'})</span>
          <span class="legend-item mono" style="margin-left:auto;">J=Jup · S=Sat</span>
        </div>
      `;
    }

    /* --- TAB 5: METHOD & AUDIT --- */
    function renderMethod() {
      return `
        <div class="section-head">
          <h1 class="section-title">Computation &amp; Cross-Check</h1>
          <span class="micro mono">VERIFIED</span>
        </div>

        <div class="kv-list" style="margin-bottom:16px;">
          <div class="kv-row">
            <div class="kv-top"><span class="kv-key">Ephemeris &amp; Ayanamsa</span><span class="micro mono">SWISS EPH 2.10</span></div>

          </div>
          <div class="kv-row">

            <span class="kv-val"><span class="mono">5+</span> BAV bindus = strong (can override weak Moon Gochara); <span class="mono">≤3</span> BAV bindus = weak / defensive posture.</span>
          </div>
          <div class="kv-row">

          </div>
        </div>

        <div class="section-head">
          <h2 class="section-title">Audit Refinements Integrated</h2>
          <span class="micro mono">4 ITEMS</span>
        </div>

        <ol class="check-list">
          <li>
            <span class="check-num mono">01</span>
            <span><strong>Guru Asta (Jupiter Combustion):</strong> Carved out mid-Sep – mid-Oct 2028 and 17 Oct – 14 Nov 2029 inside the two primary wealth windows.</span>
          </li>
          <li>
            <span class="check-num mono">02</span>
            <span><strong>Kanya Ingress Offset:</strong> Noted Jupiter's actual re-entry into Kanya on <span class="mono">24 Jul 2028</span> (12 days after the 12 Jul Mercury PD start).</span>
          </li>
          <li>
            <span class="check-num mono">03</span>
            <span><strong>Yogakaraka Mars Debilitation:</strong> Flagged Mars in Karka until <span class="mono">26 Apr 2027</span>, tightening the cleanest 2027 action sub-window to <span class="mono">27 Apr – 6 May 2027</span>.</span>
          </li>
          <li>
            <span class="check-num mono">04</span>
            <span><strong>Saturn Neecha Bhanga:</strong> Documented cancellation of Saturn's debilitation in Mesha via own-sign Mars in the 4th Kendra for the 2027–2028 Saturn Return.</span>
          </li>
        </ol>

        <div class="disclaimer-box">
          Traditional guidance, not financial advice. The times are mathematics; the meanings are tradition; the choices stay mine.
        </div>
      `;
    }

    // Initialize Application
    render();
  </script>
